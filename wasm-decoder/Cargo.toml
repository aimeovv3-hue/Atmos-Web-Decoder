[package]
name = "wasm-decoder"
version = "0.9.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Declaring an empty [workspace] makes wasm-decoder 100% standalone
# so Cargo ignores root Cargo.toml / Cargo.lock issues!
[workspace]
